<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções Exclusivas | Travel Frontiers</title>
    <meta name="description" content="Descubra as nossas promoções exclusivas de viagem. Roteiros personalizados e ofertas limitadas.">
    <link rel="canonical" href="https://promo.travelfrontiers.pt/pt">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Instant 0-second meta refresh redirect -->
    <meta http-equiv="refresh" content="0; url=https://promo.travelfrontiers.pt/pt">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0F172A;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .redirect-card {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(249, 115, 22, 0.2);
            border-top-color: #F97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        p {
            font-size: 0.95rem;
            color: #94A3B8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #F97316, #FBBF24);
            color: #FFFFFF;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 9999px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.4);
        }
    </style>

    <script>
        // Instant JavaScript redirect
        window.location.replace("https://promo.travelfrontiers.pt/pt");
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h1>A redirecionar para Promoções Travel Frontiers...</h1>
        <p>Está a ser redirecionado para a nossa plataforma oficial de ofertas exclusivas.</p>
        <a href="https://promo.travelfrontiers.pt/pt" class="btn">Aceder às Promoções</a>
    </div>
</body>
</html>

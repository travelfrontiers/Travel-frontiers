<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Travel Frontiers Instagram</title>
    <link rel="stylesheet" href="appstyle.css">
    <!-- Fonte recomendada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="main-layout">
        <section class="editor">
            <form id="promotion-form">
                <label>
                    Imagem de fundo Instagram
                    <input type="file" id="background_image" accept="image/*">
                </label>
                <div id="background-preview" class="image-preview"></div>
                <label>
                    Logo
                    <input type="file" id="logo_image" accept="image/*">
                </label>
                <div id="logo-preview" class="image-preview"></div>
                <label>
                    Tamanho do logo
                    <input type="range" id="logo_size" min="80" max="220" value="120">
                    <span id="logo_size-value">120px</span>
                </label>
                <hr>
                <label>
                    Etiqueta promocional
                    <input type="text" id="promotional_tag" value="LAST CALL">
                    <input type="color" id="promo_tag_color" value="#FFFFFF">
                    <input type="range" id="promo_tag_size" min="1.1" max="2.5" step="0.1" value="1.3">
                    <span id="promo_tag_size-value">1.3rem</span>
                </label>
                <hr>
                <label>
                    Destino
                    <input type="text" id="destination" value="MARROCOS">
                    <input type="color" id="destination_color" value="#2c3e50">
                    <input type="range" id="destination_size" min="2" max="7" step="0.1" value="5">
                    <span id="destination_size-value">5rem</span>
                </label>
                <hr>
                <label>
                    Descrição
                    <textarea id="description">Descubra Marrocos numa escapadinha exclusiva de 4 dias, com voos diretos e todos os detalhes tratados para si.</textarea>
                    <input type="color" id="description_color" value="#191B28">
                    <input type="range" id="description_size" min="1" max="2.5" step="0.1" value="1.3">
                    <span id="description_size-value">1.3rem</span>
                </label>
                <hr>
                <label>
                    <strong>Caixa Detalhes</strong><br>
                    Transparência caixa
                    <input type="range" id="details_box_transparency" min="0" max="100" value="85">
                    <span id="details_box_transparency-value">85%</span>
                </label>
                <hr>
                <label>
                    Voos/Datas <input type="text" id="flight_info" value="VOOS DIRETOS LISBOA | 20 A 23 SETEMBRO">
                </label>
                <label>
                    Serviços <input type="text" id="services" value="TRANSFERES PRIVADOS | SEGURO">
                </label>
                <label>
                    Hotel <input type="text" id="hotel_name" value="Ibn Batouta">
                </label>
                <label>
                    Preço <input type="text" id="price" value="290€">
                    Nota: <input type="text" id="price_note" value="*">
                </label>
            </form>
        </section>
        <section class="preview">
            <div id="promotion-preview" class="promotion-canvas">
                <div id="promo-tag-element" class="promo-tag-element"></div>
                <div id="destination-element" class="destination-element"></div>
                <div id="description-element" class="description-element"></div>
                <div id="details-box" class="details-box">
                    <span id="flight-info" class="flight-info"></span>
                    <span id="services-info" class="services-info"></span>
                    <span id="hotel-info" class="hotel-info"></span>
                    <div class="price-line">
                        <span id="preview-price"></span>
                        <span id="preview-note"></span>
                    </div>
                </div>
                <img id="company-logo" class="company-logo" style="display:block;">
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Completo de Promoções</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="appstyle.css">
</head>
<body>
    <div class="app-container">
        <main class="app-main">
            <div class="editor-section">
                <form id="promotion-form" class="promotion-form">
                    <!-- Secção Imagens -->
                    <div class="form-section">
                        <label>Imagem de Fundo <input type="file" id="background_image" accept="image/*"></label>
                        <div id="background-preview" class="image-preview"></div>
                        <label>Logo da Empresa <input type="file" id="logo_image" accept="image/*"></label>
                        <div id="logo-preview" class="image-preview"></div>
                        <label>Tamanho Logo <input type="range" id="logo_size" min="50" max="200" value="120"><span id="logo_size-value">120px</span></label>
                    </div>
                    <!-- Texto Promo -->
                    <div class="form-section">
                        <label>Etiqueta Promo <input type="text" id="promotional_tag" value="LAST CALL"></label>
                        <input type="range" id="promo_tag_size" min="1" max="3" step="0.1" value="1.4"><span id="promo_tag_size-value">1.4rem</span>
                        <input type="color" id="promo_tag_color" value="#ffffff"><span>Cor</span>
                        <input type="range" id="promo_tag_transparency" min="0" max="100" value="100"><span id="promo_tag_transparency-value">100%</span>
                    </div>
                    <div class="form-section">
                        <label>Título Destino <input type="text" id="destination" value="MARROCOS"></label>
                        <input type="range" id="destination_size" min="2" max="8" step="0.2" value="5"><span id="destination_size-value">5rem</span>
                        <input type="color" id="destination_color" value="#2c3e50"><span>Cor</span>
                        <input type="range" id="destination_transparency" min="0" max="100" value="100"><span id="destination_transparency-value">100%</span>
                    </div>
                    <div class="form-section">
                        <label>Descrição <textarea id="description" rows="3">Descubra Marrocos numa escapadinha exclusiva de 4 dias, com voos diretos e todos os detalhes tratados para si.</textarea></label>
                        <input type="range" id="description_size" min="1" max="2.5" step="0.1" value="1.2"><span id="description_size-value">1.2rem</span>
                        <input type="color" id="description_color" value="#34495e"><span>Cor</span>
                        <input type="range" id="description_bg_transparency" min="0" max="100" value="60"><span id="description_bg_transparency-value">60%</span>
                    </div>
                    <div class="form-section">
                        <label>Voos <input type="text" id="flight_info" value="VOOS DIRETOS LISBOA | 20 A 23 SETEMBRO"></label>
                        <input type="range" id="flight_services_size" min="1" max="2" step="0.1" value="1.1"><span id="flight_services_size-value">1.1rem</span>
                    </div>
                    <div class="form-section">
                        <label>Serviços <input type="text" id="services" value="TRANSFERES PRIVADOS | SEGURO"></label>
                    </div>
                    <div class="form-section">
                        <label>Hotel <input type="text" id="hotel_name" value="Ibn Batouta"></label>
                        <input type="range" id="hotel_size" min="1.5" max="4" step="0.1" value="2.5"><span id="hotel_size-value">2.5rem</span>
                    </div>
                    <div class="form-section">
                        <label>Preço <input type="text" id="price" value="290€"></label>
                        <input type="range" id="price_size" min="3" max="6" step="0.2" value="5"><span id="price_size-value">5rem</span>
                        <label><input type="text" id="price_note" value="*"></label>
                    </div>
                </form>
            </div>
            <!-- Preview -->
            <div class="preview-section">
                <div class="preview-container">
                    <div id="promotion-preview" class="promotion-canvas">
                        <div id="promo-tag-element" class="promo-tag-element"></div>
                        <div id="destination-element" class="destination-element"></div>
                        <div id="description-box">
                            <span id="description-text" class="description-text"></span>
                        </div>
                        <div id="info-box-element">
                            <span id="flight-info" class="flight-info"></span>
                            <span id="services-info" class="services-info"></span>
                            <span id="hotel-info" class="hotel-info"></span>
                            <span class="price-info"><span id="preview-price"></span><span id="preview-note"></span></span>
                        </div>
                        <img id="company-logo" class="company-logo" style="display:block">
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>

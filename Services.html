<link rel="stylesheet" href="tf-the.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600&family=Playfair+Display:wght@700&display=swap">

<section id="promocoes" 
  style="display:grid; gap:24px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
</section>

<script src="/tf-promo-card.js"></script>


<script>
async function carregarPromocoes() {
  const resp = await fetch('/promo.json');
  const promocoes = await resp.json();
  const container = document.getElementById('promocoes');

  promocoes.forEach(promo => {
    const card = document.createElement('tf-promo-card');
    for (const [chave, valor] of Object.entries(promo)) {
      if (valor) card.setAttribute(chave, valor);
    }
    container.appendChild(card);
  });
}

carregarPromocoes();
</script>

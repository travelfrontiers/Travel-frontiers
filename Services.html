<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoções</title>

  <!-- Tema e fontes -->
  <link rel="stylesheet" href="tf-the.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600&family=Playfair+Display:wght@700&display=swap">
</head>
<body>

  <h1>Promoções</h1>
  <section id="promocoes"></section>

  <!-- Carregar o componente primeiro -->
  <script src="/tf-promo-card.js"></script>

  <!-- Script para ir buscar e mapear os dados -->
  <script>
  async function carregarPromocoes() {
    const container = document.getElementById('promocoes');
    container.innerHTML = '';

    try {
      const resp = await fetch('/promo.json');

      if (!resp.ok) {
        throw new Error(`Erro HTTP: ${resp.status} ${resp.statusText}`);
      }

      let promocoes;
      try {
        promocoes = await resp.json();
      } catch (e) {
        throw new Error('O ficheiro promo.json não é JSON válido. Verifica vírgulas, chaves e colchetes.');
      }

      if (!Array.isArray(promocoes)) {
        throw new Error('O ficheiro promo.json deve conter um array de objetos.');
      }

      if (promocoes.length === 0) {
        container.innerHTML = '<p>Não há promoções para mostrar.</p>';
        return;
      }

      // Mapeamento dos campos do JSON para os atributos esperados
      promocoes.forEach(promo => {
        const card = document.createElement('tf-promo-card');

        card.setAttribute('imagem', promo['image-src'] || '');
        card.setAttribute('titulo', promo['destination'] || '');
        card.setAttribute('descricao', promo['subtitle'] || promo['origin'] || '');
        card.setAttribute('preco', (promo['price'] || '') + (promo['currency'] || ''));
        card.setAttribute('link', promo['link'] || '#');
        // Se no futuro tiveres desconto:
        // card.setAttribute('desconto', promo['desconto'] || '');

        container.appendChild(card);
      });

    } catch (erro) {
      console.error(erro);
      container.innerHTML = `<p style="color:red">⚠ Erro ao carregar promoções: ${erro.message}</p>`;
    }
  }

  carregarPromocoes();
  </script>

</body>
</html>

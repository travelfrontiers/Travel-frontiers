<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoções</title>

  <link rel="stylesheet" href="/tf-the.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600&family=Playfair+Display:wght@700&display=swap">
</head>
<body>

  <h1>Promoções</h1>
  <section id="promocoes"></section>

  <!-- Web Component -->
  <script src="tf-promo-card.js"></script>

  <!-- Script de carregamento dinâmico -->
  <script>
    fetch('promo.json')
      .then(res => res.json())
      .then(promocoes => {
        const container = document.getElementById('promocoes');

        promocoes.forEach(promo => {
          const card = document.createElement('tf-promo-card');
          card.className = promo.formato;

          card.innerHTML = `
            <a class="card" href="${promo.link}">
              <div class="image">
                <img src="${promo.imagem}" alt="${promo.titulo} - ${promo.subtitulo}">
                ${promo.badge ? `<span class="badge">${promo.badge}</span>` : ''}
              </div>
              <div class="overlay">
                <h2 class="title">${promo.titulo}</h2>
                <p class="subtitle">${promo.subtitulo}</p>
                <p class="meta">${promo.meta}</p>
                <p class="includes">${promo.inclui}</p>
                <p class="hotel">${promo.hotel}</p>
                <div class="price">${promo.preco}</div>
                <img class="logo" src="${promo.logo}" alt="Travel Frontiers">
              </div>
            </a>
          `;

          container.appendChild(card);
        });
      })
      .catch(err => console.error('Erro ao carregar promoções:', err));
  </script>

  <!-- Carregar o web component antes de o usarmos -->
<script src="tf-promo-card.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('promo.json')
    .then(r => {
      if (!r.ok) throw new Error(`Erro HTTP ${r.status}`);
      return r.json();
    })
    .then(promos => {
      const container = document.getElementById('promocoes');
      if (!container) throw new Error('Elemento #promocoes não encontrado');

      promos.forEach(p => {
        const card = document.createElement('tf-promo-card');
        card.data = p; // já no formato certo
        container.appendChild(card);
      });
    })
    .catch(err => console.error('Falha ao carregar promoções:', err));
});
</script>

</body>
</html>

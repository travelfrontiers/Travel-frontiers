<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Travel Frontiers Forum</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Header — Matching main site glassmorphism style -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="https://www.travelfrontiers.pt/">
                    <img src="https://www.travelfrontiers.pt/img/TF_globnobg2.webp" alt="Travel Frontiers Logo" class="logo-img">
                    <span>Travel Frontiers</span>
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="https://www.travelfrontiers.pt/" class="nav-link" data-translate="nav.home">Início</a></li>
                <li><a href="https://www.travelfrontiers.pt/#services" class="nav-link" data-translate="nav.services">Serviços</a></li>
                <li><a href="./" class="nav-link" data-translate="nav.forum">Fórum</a></li>
                <li><a href="https://www.travelfrontiers.pt/#contact" class="nav-link" data-translate="nav.contact">Contacto</a></li>
            </ul>
            <div class="nav-actions">
                <!-- Language Selector -->
                <div class="language-selector">
                    <button class="lang-button" id="currentLang">
                        <span>🌐</span>
                        <span id="langCode">PT</span>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <button onclick="changeForumLanguage('pt')">Português</button>
                        <button onclick="changeForumLanguage('en')">English</button>
                        <button onclick="changeForumLanguage('fr')">Français</button>
                    </div>
                </div>
                <!-- Mobile Menu Button -->
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Post Content -->
    <main class="post-container">
        <!-- Breadcrumb -->
        <nav class="post-breadcrumb" aria-label="breadcrumb">
            <a id="breadcrumbBack" href="./">← <span data-translate="nav.forum">Fórum</span></a>
        </nav>

        <!-- Loading State -->
        <div id="postLoading" class="loading" data-translate="loading.post">Carregando post...</div>

        <!-- Post Article -->
        <article id="postContent" class="post-article hidden">
            <header class="post-header">
                <h1 id="postTitle"></h1>
                <div class="post-meta">
                    <span id="postAuthor" class="meta-author"></span>
                    <span id="postDate" class="meta-date"></span>
                    <span id="postReadTime" class="meta-readtime"></span>
                    <span id="postDestination" class="meta-destination"></span>
                </div>
                <div id="postTags" class="post-tags hidden"></div>
                <img id="postImage" src="" alt="" class="post-thumbnail">
            </header>

            <div class="post-body">
                <div id="postBody" class="post-text"></div>

                <!-- Affiliate Link (if applicable) -->
                <div id="affiliateSection" class="affiliate-section hidden">
                    <div class="affiliate-box">
                        <a id="affiliateLink" href="" target="_blank" rel="noopener noreferrer" class="affiliate-button">
                            <span id="affiliateText"></span>
                            <span class="affiliate-icon">→</span>
                        </a>
                    </div>
                </div>

                <!-- CTA Section -->
                <section class="post-cta">
                    <div class="cta-box">
                        <h3 id="ctaTitle"></h3>
                        <a id="ctaButton" href="#" class="btn btn-primary">Contact me</a>
                    </div>
                </section>

                <!-- Related Posts -->
                <section id="relatedSection" class="related-posts hidden">
                    <h3 data-translate="post.readAlso">Leia Também</h3>
                    <div id="relatedContainer" class="related-grid"></div>
                </section>
            </div>

            <!-- Like & Share Section -->
            <footer class="post-footer">
                <button id="likeBtn" class="like-button">
                    <span class="like-icon">♥</span>
                    <span id="likeCount">0</span> <span data-translate="post.likes">Gostos</span>
                </button>
            </footer>
        </article>

        <!-- Comments Section -->
        <section id="commentsSection" class="comments-section hidden">
            <h2 data-translate="comments.title">Comentários</h2>

            <!-- Comments List -->
            <div id="commentsList" class="comments-list">
                <!-- Approved comments loaded here -->
            </div>

            <!-- Comment Form -->
            <form id="commentForm" class="comment-form">
                <h3 data-translate="comments.leaveComment">Deixe um Comentário</h3>
                
                <div class="form-group">
                    <label for="commenterName" data-translate="comments.name">Nome *</label>
                    <input type="text" id="commenterName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="commenterEmail">Email *</label>
                    <input type="email" id="commenterEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="commenterText" data-translate="comments.comment">Comentário *</label>
                    <textarea id="commenterText" name="comment" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary" data-translate="comments.submit">Enviar Comentário</button>
                <div id="formFeedback" class="form-feedback hidden"></div>
                <p class="form-note" data-translate="comments.moderation">Os comentários serão moderados antes de aparecer.</p>
            </form>
        </section>
    </main>

    <!-- Footer — Dark matching main site -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Travel Frontiers. <span data-translate="footer.rights">Todos os direitos reservados.</span></p>
            <a href="https://www.travelfrontiers.pt/" data-translate="footer.backToSite">Voltar ao site</a>
        </div>
    </footer>

    <script src="./script.js"></script>
</body>
</html>

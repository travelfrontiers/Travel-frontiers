name: Converter imagens para WebP

on:
  push:
    branches: [ main ]

jobs:
  convert_webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Converte PNG/JPG/JPEG -> WebP com auto-orient
        run: |
          find ./img \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            -exec sh -c '
              out="${0%.*}.webp"
              if [ ! -f "$out" ] || [ "$0" -nt "$out" ]; then
                magick "$0" -auto-orient -quality 80 "$out"
              fi
            ' {} \;

      - name: Configura autenticação GitHub
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Faz commit das WebP geradas
        run: |
          git add img/*.webp || true
          git commit -m "Geradas imagens WebP via Action" || exit 0
          git push

name: Sync Forum Index

on:
  workflow_dispatch:
  push:
    paths:
      - "forum/posts/*.json"
      - "!forum/posts/index.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find changed post
        id: post
        shell: bash
        run: |
          file=$(git diff --name-only HEAD^ HEAD -- 'forum/posts/*.json' ':!forum/posts/index.json' | head -n 1)
          id=$(basename "$file" .json)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Update forum index
        if: steps.post.outputs.id != ''
        run: python scripts/sync-post-to-index.py "${{ steps.post.outputs.id }}"

name: Sync Forum Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "forum/posts/*.json"
      - "!forum/posts/index.json"

permissions:
  contents: write

concurrency:
  group: forum-index-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Update and commit the forum index
        shell: bash
        run: |
          python scripts/sync-post-to-index.py
          git add forum/posts/index.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Travel Frontiers Bot" -c user.email="bot@travelfrontiers.pt" commit -m "bot: sync forum index"
          git push origin HEAD:main
